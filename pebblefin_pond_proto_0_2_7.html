<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pebblefin Pond 0.2.7</title>
<style>
:root{--ink:#17333e;--sky:#bcecff;--water:#5fc7dc;--deep:#36a8c5;--purple:#6847d8;--gold:#ffd43e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07161d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button{font:inherit;touch-action:manipulation}
#game{position:relative;width:100%;height:100%;max-width:520px;margin:auto;overflow:hidden;background:linear-gradient(var(--sky) 0 31%,var(--water) 31% 100%)}
.skyline{position:absolute;left:0;right:0;top:19%;height:14%;background:#7fbd82;clip-path:polygon(0 50%,12% 30%,25% 43%,40% 18%,55% 44%,70% 22%,84% 40%,100% 18%,100% 100%,0 100%)}
.farwater{position:absolute;left:0;right:0;top:31%;bottom:0;background:linear-gradient(#68ccdf,#3baac5)}
.wave{position:absolute;border:3px solid rgba(255,255,255,.18);border-radius:50%;transform:translate(-50%,-50%)}
.w1{left:62%;top:60%;width:160px;height:38px}.w2{left:62%;top:60%;width:260px;height:70px}.w3{left:62%;top:60%;width:390px;height:112px}
.hud{position:absolute;z-index:30;top:calc(env(safe-area-inset-top) + 10px);left:13px;right:13px;display:flex;align-items:center;gap:8px}
.title{font-size:20px;font-weight:1000;flex:1;text-shadow:0 1px white}
.pill{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.94);border:3px solid rgba(23,51,62,.1);font-weight:1000;white-space:nowrap}
.xp{position:absolute;z-index:30;top:calc(env(safe-area-inset-top) + 51px);left:13px;right:13px;height:16px;border-radius:999px;background:rgba(255,255,255,.88);border:3px solid rgba(23,51,62,.1);overflow:hidden}
.xpfill{height:100%;width:0;background:linear-gradient(90deg,#ffe25c,#ffad2b)}
.xplabel{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:1000}
.version{position:absolute;z-index:31;right:13px;top:calc(env(safe-area-inset-top) + 74px);font-size:10px;font-weight:1000;background:rgba(255,255,255,.82);padding:4px 7px;border-radius:9px}
.status{position:absolute;z-index:25;top:15.5%;left:50%;transform:translateX(-50%);width:min(78%,360px);text-align:center;font-weight:1000;font-size:17px;text-shadow:0 1px rgba(255,255,255,.8)}
.status small{display:block;font-size:11px;margin-top:2px;opacity:.7}
.dock{position:absolute;z-index:8;left:0;bottom:0;width:100%;height:92px;background:linear-gradient(#9c683a,#774725);border-top:7px solid #60391f}
.dock:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 52px,rgba(64,36,19,.22) 52px 56px)}
.reeds{position:absolute;z-index:7;left:0;right:0;bottom:82px;height:45px;background:repeating-linear-gradient(78deg,transparent 0 19px,#4b934f 20px 24px,transparent 25px 38px);opacity:.8}

/* Foreground fishing rig — v0.2.5 recognizable tapered rod + controlled flex */
.rodPivot{position:absolute;z-index:16;left:-18px;bottom:72px;width:250px;height:430px;pointer-events:none}
.rodSvg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 3px 2px rgba(31,26,86,.22))}
#rodShadow{fill:none;stroke:#302360;stroke-width:12;stroke-linecap:round}
#rodPath{fill:none;stroke:#7654e8;stroke-width:8;stroke-linecap:round}
#rodHighlight{fill:none;stroke:#d7ceff;stroke-width:2.1;stroke-linecap:round;opacity:.82}
.rodGuide{fill:#d8d1ff;stroke:#382778;stroke-width:2}
#tip{fill:#2f216c;stroke:#e7e2ff;stroke-width:1}
.gripSvg{stroke:#633719;stroke-width:25;stroke-linecap:round}
.gripWrap{stroke:#b87434;stroke-width:18;stroke-linecap:round;stroke-dasharray:9 6}
.reelBody{fill:#d7dfe2;stroke:#263f49;stroke-width:3}
.reelHub{fill:#704dd8;stroke:#35266f;stroke-width:3}
.reelArm{stroke:#263f49;stroke-width:4;stroke-linecap:round}
.reelKnob{fill:#263f49}

#lineSvg{position:absolute;z-index:14;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
#linePath{fill:none;stroke:#f8feff;stroke-width:2.5;stroke-linecap:round;filter:drop-shadow(0 0 1.5px rgba(24,58,69,.75))}
#linePath.tense{stroke-width:3;filter:drop-shadow(0 0 2px rgba(255,255,255,.95))}

#bobber{position:absolute;z-index:17;width:22px;height:27px;transform:translate(-50%,-50%);pointer-events:none}
#bobber:before{content:"";position:absolute;left:9px;top:0;width:4px;height:9px;border-radius:4px;background:#f8fbff}
#bobber:after{content:"";position:absolute;left:2px;top:7px;width:18px;height:18px;border-radius:50%;background:linear-gradient(#f24c57 0 48%,white 48%);border:2px solid rgba(23,51,62,.3);box-shadow:0 2px 3px rgba(0,0,0,.12)}
#bobber.bite{animation:bob .24s infinite alternate}
@keyframes bob{to{transform:translate(-50%,-50%) translateY(13px)}}
#splash{position:absolute;z-index:18;transform:translate(-50%,-50%);font-size:48px;opacity:0;pointer-events:none}
#splash.show{animation:splash .6s ease}
@keyframes splash{0%{opacity:1;transform:translate(-50%,-50%) scale(.35)}65%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}}


.fightFx{position:absolute;z-index:18;pointer-events:none;transform:translate(-50%,-50%)}
.fxBubble{position:absolute;border:2px solid rgba(255,255,255,.72);border-radius:50%;animation:fxBubble .72s ease-out forwards}
@keyframes fxBubble{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  18%{opacity:.9}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.25)}
}
.fxRing{position:absolute;border:3px solid rgba(255,255,255,.46);border-radius:50%;animation:fxRing .58s ease-out forwards}
@keyframes fxRing{
  from{opacity:.8;transform:translate(-50%,-50%) scale(.25)}
  to{opacity:0;transform:translate(-50%,-50%) scale(2.5)}
}
.fxDrop{position:absolute;font-size:var(--drop);animation:fxDrop .55s ease-out forwards}
@keyframes fxDrop{
  0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(.65)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.05)}
}


.fightCue{
 display:none;position:absolute;z-index:24;left:50%;
 bottom:calc(env(safe-area-inset-bottom) + 190px);
 transform:translateX(-50%);
 min-width:190px;padding:8px 16px;border-radius:12px;
 background:linear-gradient(#a84cff,#7540dc);
 border:3px solid #33206d;color:white;text-align:center;
 font-size:16px;font-weight:1000;
 box-shadow:0 4px 0 rgba(32,24,68,.35)
}
.fightCue.show{display:block;animation:cueIn .18s ease}
@keyframes cueIn{from{opacity:0;transform:translateX(-50%) translateY(8px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

/* fight timing bar appears over the water */
.fight{display:none;position:absolute;z-index:22;left:50%;bottom:calc(env(safe-area-inset-bottom) + 151px);transform:translateX(-50%);width:min(78%,360px)}
.fight.show{display:block}
.callout{text-align:center;color:white;font-size:25px;font-weight:1000;-webkit-text-stroke:1px rgba(23,51,62,.5);text-shadow:0 3px 0 rgba(23,51,62,.35);height:36px}
.track{position:relative;height:21px;border-radius:999px;background:#263944;border:4px solid white;box-shadow:0 3px 0 rgba(23,51,62,.35);overflow:hidden}
.good{position:absolute;top:0;bottom:0;background:#ffd83d}
.perfect{position:absolute;top:0;bottom:0;background:#6ee78e}
.marker{position:absolute;top:-5px;width:9px;height:25px;background:white;border-radius:7px;transform:translateX(-50%);box-shadow:0 0 5px white}

/* large circular action button */
.actionWrap{position:absolute;z-index:28;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);width:104px;height:104px}
#action{width:104px;height:104px;border-radius:50%;border:7px solid #283b45;background:radial-gradient(circle at 40% 32%,#fafafa,#bfc7ca 65%,#818b90);box-shadow:0 7px 0 #15262d,0 0 0 4px rgba(255,255,255,.65);font-size:34px;font-weight:1000;color:#273b45}
#action.hook,#action.reel{background:radial-gradient(circle at 40% 32%,#f2b8ff,#8b49ed 65%,#5b2ab7);color:white}
#action:active{transform:translateY(4px);box-shadow:0 3px 0 #15262d,0 0 0 4px rgba(255,255,255,.65)}
.bait{position:absolute;z-index:27;left:14px;bottom:calc(env(safe-area-inset-bottom) + 23px);background:rgba(255,255,255,.93);border:3px solid rgba(23,51,62,.12);border-radius:18px;padding:8px 11px;font-weight:1000}
.bait small{display:block;font-size:10px;opacity:.65}
.hearts{position:absolute;z-index:32;right:14px;top:calc(env(safe-area-inset-top) + 104px);font-size:16px;display:none;background:rgba(255,255,255,.80);padding:4px 7px;border-radius:999px;border:2px solid rgba(23,51,62,.10)}

/* catch */
.overlay{display:none!important;position:absolute;z-index:60;inset:0;background:rgba(12,26,36,.72);align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex!important}
.card{width:100%;border-radius:25px;overflow:hidden;background:#f8f4ff;border:4px solid #4d2b88;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.cardtop{padding:18px 18px 8px;background:linear-gradient(#7b43df,#a85bea);color:white}
.new{font-size:14px;font-weight:1000;color:#caff7b}.rarity{font-size:12px;font-weight:1000;letter-spacing:1.3px}.art{font-size:88px;line-height:1.15}.name{font-size:30px;font-weight:1000;margin:0}.meta{font-weight:1000;margin-top:5px}
.rewardrow{padding:14px;display:flex;justify-content:center;gap:10px;font-weight:1000}.reward{background:white;border:2px solid #ddd3ec;border-radius:14px;padding:8px 12px}
#again{width:calc(100% - 28px);margin:0 14px 15px;min-height:50px;border:0;border-radius:15px;background:#72d33e;color:#17333e;font-weight:1000;font-size:18px}


/* v0.2.1 Fishing Feel */
#game.biteShake{animation:biteShake .25s ease}
@keyframes biteShake{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}65%{transform:translateX(3px)}}
.fight.show{animation:meterIn .18s ease-out}
@keyframes meterIn{from{opacity:0;transform:translateX(-50%) translateY(12px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.track.hit{animation:trackHit .22s ease}.track.miss{animation:trackMiss .22s ease}
@keyframes trackHit{50%{transform:scale(1.06);filter:brightness(1.3)}}
@keyframes trackMiss{25%{transform:translateX(-7px)}55%{transform:translateX(7px)}80%{transform:translateX(-4px)}}
.callout.pop{animation:callPop .34s ease}
@keyframes callPop{0%{transform:scale(.6);opacity:.2}55%{transform:scale(1.28);opacity:1}100%{transform:scale(1)}}
.catchFish{
 display:none;position:absolute;z-index:55;left:50%;top:57%;font-size:88px;
 transform:translate(-50%,-50%);filter:drop-shadow(0 8px 5px rgba(20,40,50,.28));pointer-events:none
}
.catchFish.show{display:block;animation:fishLeap .9s cubic-bezier(.2,.75,.25,1)}
@keyframes fishLeap{
 0%{transform:translate(-50%,70%) rotate(-18deg) scale(.45);opacity:0}
 18%{opacity:1}
 55%{transform:translate(-50%,-115%) rotate(14deg) scale(1.18)}
 78%{transform:translate(-50%,-78%) rotate(-5deg) scale(1)}
 100%{transform:translate(-50%,-82%) rotate(0) scale(1)}
}


/* ===== v0.2.2 Pond Life + Fight Feel + Level Up ===== */
.ambientFish{
  position:absolute;z-index:5;width:54px;height:22px;opacity:.18;pointer-events:none;
  filter:blur(.2px);transform-origin:center;
}
.ambientFish:before{
  content:"";position:absolute;left:9px;top:4px;width:32px;height:14px;
  border-radius:55% 45% 45% 55%;background:#184d60;
}
.ambientFish:after{
  content:"";position:absolute;left:0;top:5px;width:15px;height:14px;background:#184d60;
  clip-path:polygon(100% 50%,0 0,0 100%);
}
.ambientFish.reverse{transform:scaleX(-1)}
.af1{top:43%;animation:swimRight 10s linear infinite}
.af2{top:52%;animation:swimLeft 13s linear infinite 2.5s;opacity:.13;transform:scale(.75)}
.af3{top:68%;animation:swimRight 15s linear infinite 5s;opacity:.11;transform:scale(1.15)}
.af4{top:78%;animation:swimLeft 17s linear infinite 1s;opacity:.09;transform:scale(.6)}
@keyframes swimRight{from{left:-70px}to{left:110%}}
@keyframes swimLeft{from{right:-70px}to{right:110%}}

.bubble{
  position:absolute;z-index:6;width:7px;height:7px;border:2px solid rgba(255,255,255,.28);
  border-radius:50%;opacity:0;pointer-events:none
}
.b1{left:23%;bottom:26%;animation:bubbleUp 6s ease-in infinite}
.b2{left:74%;bottom:20%;animation:bubbleUp 7.5s ease-in infinite 2s}
.b3{left:58%;bottom:34%;animation:bubbleUp 9s ease-in infinite 4s}
@keyframes bubbleUp{
  0%{transform:translateY(0) scale(.6);opacity:0}
  18%{opacity:.7}
  100%{transform:translateY(-170px) scale(1.25);opacity:0}
}
.ripplePulse{
  position:absolute;z-index:6;width:20px;height:8px;border:2px solid rgba(255,255,255,.28);
  border-radius:50%;opacity:0;pointer-events:none
}
.rp1{left:34%;top:49%;animation:ripplePulse 5s ease-out infinite 1s}
.rp2{left:81%;top:58%;animation:ripplePulse 7s ease-out infinite 3s}
@keyframes ripplePulse{
  0%{transform:scale(.2);opacity:0}
  20%{opacity:.7}
  100%{transform:scale(4.4);opacity:0}
}

.reeds{animation:reedSway 3.8s ease-in-out infinite alternate;transform-origin:bottom center}
@keyframes reedSway{from{transform:skewX(-1.5deg)}to{transform:skewX(2deg)}}

.levelOverlay{
  display:none!important;position:absolute;z-index:80;inset:0;
  background:rgba(10,28,36,.72);align-items:center;justify-content:center;padding:22px;
}
.levelOverlay.show{display:flex!important;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.levelCard{
  width:100%;max-width:390px;background:linear-gradient(#fff9dd,#fff);
  border:4px solid #f0b928;border-radius:28px;padding:24px 20px;text-align:center;
  box-shadow:0 22px 60px rgba(0,0,0,.35);position:relative;overflow:hidden
}
.levelBurst{
  position:absolute;inset:-30%;
  background:repeating-conic-gradient(from 0deg,rgba(255,211,65,.22) 0 10deg,transparent 10deg 20deg);
  animation:spinBurst 12s linear infinite
}
@keyframes spinBurst{to{transform:rotate(360deg)}}
.levelContent{position:relative;z-index:2}
.levelEyebrow{font-size:14px;font-weight:1000;letter-spacing:2px;color:#b57900}
.levelTitle{font-size:38px;font-weight:1000;margin:4px 0 2px}
.levelNumber{font-size:64px;font-weight:1000;line-height:1;color:#6a4bd9;text-shadow:0 4px 0 #e3dbff}
.levelReward{
  display:inline-flex;gap:8px;align-items:center;margin-top:14px;padding:10px 15px;
  border-radius:16px;background:#fff;border:3px solid #eee2b7;font-size:18px;font-weight:1000
}
.levelNote{font-size:12px;font-weight:900;opacity:.65;margin-top:8px}
#levelContinue{
  width:100%;margin-top:18px;min-height:52px;border:0;border-radius:17px;
  background:linear-gradient(#83e653,#58c936);box-shadow:0 6px 0 #329d1b;
  color:#17333e;font-size:19px;font-weight:1000
}

@media(max-height:720px){
 .status{top:13.5%}.rodPivot{bottom:60px;transform:scale(.88);transform-origin:bottom left}
 .actionWrap{bottom:calc(env(safe-area-inset-bottom) + 15px);transform:translateX(-50%) scale(.88)}
 .bait{bottom:calc(env(safe-area-inset-bottom) + 18px)}
}
</style>
</head>
<body>
<div id="game">
 <div class="hud"><div class="title">Pebblefin Pond</div><div class="pill">🪙 <span id="coins">100</span></div><div class="pill">Lv <span id="level">0</span></div></div>
 <div class="xp"><div class="xpfill" id="xpfill"></div><div class="xplabel" id="xplabel">0 / 50 XP</div></div>
 <div class="version">v0.2.7</div>
 <div class="skyline"></div><div class="farwater"><div class="wave w1"></div><div class="wave w2"></div><div class="wave w3"></div></div>
 <div class="ambientFish af1"></div><div class="ambientFish af2 reverse"></div>
 <div class="ambientFish af3"></div><div class="ambientFish af4 reverse"></div>
 <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
 <div class="ripplePulse rp1"></div><div class="ripplePulse rp2"></div>

 <div class="status" id="status">Ready to cast.<small id="sub">Starter Rod • Starter Bait</small></div>
 <div class="reeds"></div><div class="dock"></div>

 <div class="rodPivot" id="rodPivot">
   <svg class="rodSvg" viewBox="0 0 250 430" aria-hidden="true">
     <path class="gripSvg" d="M24 425 L39 372"></path>
     <path class="gripWrap" d="M24 425 L39 372"></path>
     <circle class="reelBody" cx="51" cy="378" r="17"></circle>
     <circle class="reelHub" cx="51" cy="378" r="8"></circle>
     <path class="reelArm" d="M63 386 L75 397"></path>
     <circle class="reelKnob" cx="78" cy="400" r="5"></circle>
     <path id="rodShadow"></path>
     <path id="rodPath"></path>
     <path id="rodHighlight"></path>
     <circle class="rodGuide" id="guide1" r="5"></circle>
     <circle class="rodGuide" id="guide2" r="4.5"></circle>
     <circle class="rodGuide" id="guide3" r="4"></circle>
     <circle id="tip" r="4"></circle>
   </svg>
 </div>
 <svg id="lineSvg" aria-hidden="true"><path id="linePath"></path></svg>
 <div id="bobber"></div><div id="splash">💦</div><div class="fightFx" id="fightFx"></div><div class="catchFish" id="catchFish"></div>

 <div class="fightCue" id="fightCue">NOW! REEL IT IN!</div><div class="fight" id="fight"><div class="callout" id="callout"></div><div class="track"><div class="good" id="good"></div><div class="perfect" id="perfect"></div><div class="marker" id="marker"></div></div></div>
 <div class="hearts" id="hearts">❤️❤️❤️</div>

 <div class="bait"><small>Starter Bait</small>🪱 <span id="bait">20</span></div>
 <div class="actionWrap"><button id="action" type="button">🎣</button></div>

 <div class="overlay" id="overlay"><div class="card">
  <div class="cardtop"><div class="new" id="newtag"></div><div class="rarity" id="rarity"></div><div class="art" id="art"></div><h2 class="name" id="name"></h2><div class="meta" id="meta"></div></div>
  <div class="rewardrow"><div class="reward">🪙 +<span id="gaincoins"></span></div><div class="reward">⭐ +<span id="gainxp"></span> XP</div></div>
  <button id="again">FISH AGAIN</button>
 </div></div>

 <div class="levelOverlay" id="levelOverlay">
   <div class="levelCard">
     <div class="levelBurst"></div>
     <div class="levelContent">
       <div class="levelEyebrow">LEVEL UP!</div>
       <div class="levelTitle">You reached</div>
       <div class="levelNumber">Lv <span id="levelReached">1</span></div>
       <div class="levelReward">🪙 +<span id="levelCoins">60</span></div>
       <div class="levelNote">Level reward added to your coins.</div>
       <button id="levelContinue">CONTINUE</button>
     </div>
   </div>
 </div>

</div>
<script>

(()=>{
"use strict";
const $=id=>document.getElementById(id);

const fish=[
 {id:1,name:"Pebblit",rarity:"Basic",chance:48,coins:[3,6],xp:5,lb:[.2,1.1],hits:[1,2],zone:.48,speed:.72,art:"🐟"},
 {id:2,name:"Mudskip",rarity:"Basic",chance:34,coins:[4,7],xp:6,lb:[.4,1.8],hits:[2,3],zone:.42,speed:.82,art:"🐡"},
 {id:5,name:"Paddlerib",rarity:"Uncommon",chance:14,coins:[9,15],xp:10,lb:[1.5,5],hits:[3,4],zone:.34,speed:.95,art:"🐸"},
 {id:8,name:"Vertijaw",rarity:"Rare",chance:4,coins:[35,55],xp:30,lb:[6,18],hits:[4,6],zone:.27,speed:1.12,art:"👹"}
];

const S={
 phase:"ready",coins:100,bait:20,xp:0,level:0,xpNeed:50,first:true,
 found:new Set(),records:{},f:null,weight:0,need:0,done:0,hearts:3,
 bobX:0,bobY:0,t1:null,t2:null,markerRaf:null,castRaf:null,fightRaf:null,rigRaf:null,
 last:0,pos:.1,dir:1,center:.5,width:.4,speed:.8,baseWidth:.34,baseSpeed:1.2,
 fightT:0,pull:0,reelKick:0,missKick:0,biteKick:0,castP:0,pullSide:1,pullStrength:0,roundStart:0,
 inputLocked:false,levelQueue:[],pendingCatchCard:false
};
const xpNeeds=[50,80,125,190,285,425,625,900,1275,1750];
const rand=(a,b)=>Math.random()*(b-a)+a;
const rint=(a,b)=>Math.floor(rand(a,b+1));

function gameRect(){return $("game").getBoundingClientRect()}
function waterPoint(){const g=gameRect();return{x:g.width*.61,y:g.height*.59}}
function setBob(x,y){
 S.bobX=x;S.bobY=y;
 $("bobber").style.left=x+"px";$("bobber").style.top=y+"px";
 $("splash").style.left=x+"px";$("splash").style.top=y+"px"
}

function cubicPoint(p0,p1,p2,p3,t){
 const u=1-t;
 return{
   x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,
   y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y
 }
}
function rodLocalGeometry(){
 const castWave=Math.sin(Math.PI*Math.min(1,S.castP||0));
 const tension=(S.phase==="fight"||S.phase==="landing")?S.pull:0;
 const kick=Math.max(0,S.reelKick*.45+S.biteKick*.32-S.missKick*.06);
 const bend=Math.max(0,Math.min(1,tension*.88+kick));
 const base={x:36,y:382};
 let tip={x:151,y:28};

 if(S.phase==="casting"){
   tip={x:151+62*castWave,y:28+46*castWave};
 }else if(S.phase==="hook"){
   tip={x:155,y:32+16*S.biteKick};
 }else if(S.phase==="fight"||S.phase==="landing"){
   tip={x:153+18*S.pullSide*bend,y:28+36*bend};
 }

 /* Tall, recognizable fishing rod: rigid lower section, flexible upper section. */
 const c1={x:55,y:286+4*bend};
 const c2={x:111+9*S.pullSide*bend,y:126+62*bend};
 return{base,c1,c2,tip}
}
function updateRod(){
 const g=rodLocalGeometry();
 const d=`M ${g.base.x} ${g.base.y} C ${g.c1.x} ${g.c1.y}, ${g.c2.x} ${g.c2.y}, ${g.tip.x} ${g.tip.y}`;
 $("rodShadow").setAttribute("d",d);
 $("rodPath").setAttribute("d",d);
 $("rodHighlight").setAttribute("d",d);
 [0.42,0.70,0.90].forEach((t,i)=>{
   const p=cubicPoint(g.base,g.c1,g.c2,g.tip,t),el=$("guide"+(i+1));
   el.setAttribute("cx",p.x);el.setAttribute("cy",p.y)
 });
 $("tip").setAttribute("cx",g.tip.x);$("tip").setAttribute("cy",g.tip.y);
}
function tipPoint(){
 const game=gameRect(),r=$("tip").getBoundingClientRect();
 return{x:r.left-game.left+r.width/2,y:r.top-game.top+r.height/2}
}
function updateLine(){
 const a=tipPoint(),b={x:S.bobX,y:S.bobY},path=$("linePath");
 const dx=b.x-a.x,dy=b.y-a.y;
 const fighting=S.phase==="fight"||S.phase==="hook"||S.phase==="landing";
 const sag=fighting?Math.max(1,8-6*S.pull):18;
 const sway=fighting?Math.sin(S.fightT*2.2)*7*(.35+S.pull):0;
 const cx=a.x+dx*.56+sway,cy=a.y+dy*.52+sag;
 path.setAttribute("d",`M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`);
 path.classList.toggle("tense",fighting);
}
function rigLoop(){
 updateRod();updateLine();
 S.reelKick*=.84;S.missKick*=.82;S.biteKick*=.84;
 S.rigRaf=requestAnimationFrame(rigLoop)
}

function splash(){const e=$("splash");e.classList.remove("show");void e.offsetWidth;e.classList.add("show")}
function popCallout(txt){const e=$("callout");e.textContent=txt;e.classList.remove("pop");void e.offsetWidth;e.classList.add("pop")}
function pulseTrack(cls){
 const e=document.querySelector(".track");
 e.classList.remove("hit","miss");void e.offsetWidth;e.classList.add(cls);
 setTimeout(()=>e.classList.remove(cls),250)
}
function screenShake(){
 const g=$("game");g.classList.remove("biteShake");void g.offsetWidth;g.classList.add("biteShake");
 setTimeout(()=>g.classList.remove("biteShake"),270)
}

function pick(){
 if(S.first)return fish[0];
 let n=fish.reduce((a,f)=>a+f.chance,0),r=Math.random()*n;
 for(const f of fish){r-=f.chance;if(r<=0)return f}
 return fish[0]
}
function status(a,b){$("status").firstChild.nodeValue=a;$("sub").textContent=b||""}
function render(){
 $("coins").textContent=S.coins;$("bait").textContent=S.bait;$("level").textContent=S.level;
 $("xplabel").textContent=`${S.xp} / ${S.xpNeed} XP`;
 $("xpfill").style.width=Math.min(100,S.xp/S.xpNeed*100)+"%";
 $("hearts").textContent="❤️".repeat(S.hearts)+"🖤".repeat(3-S.hearts);
 $("hearts").style.display=(S.phase==="fight"||S.phase==="landing")?"block":"none";
 const b=$("action");b.disabled=false;b.className="";
 if(S.phase==="ready"){
   b.textContent="🎣";b.disabled=S.bait<=0;
   status(S.bait?"Ready to cast.":"Out of bait.",S.bait?"Tap the reel to cast.":"Reload the prototype to refill bait.")
 }else if(S.phase==="casting"){
   b.textContent="…";b.disabled=true;status("Casting...","")
 }else if(S.phase==="waiting"){
   b.textContent="🎣";b.disabled=true;status("Watch the bobber.","Wait for a bite.")
 }else if(S.phase==="hook"){
   b.textContent="!";b.className="hook";status("BITE!","Tap now!")
 }else if(S.phase==="fight"){
   b.textContent=S.inputLocked?"…":"↻";b.className="reel";b.disabled=S.inputLocked;
   status("Fish on!",S.inputLocked?"Hold on...":"Hit the timing zone.")
 }else{
   b.textContent="…";b.disabled=true
 }
}
function clearMarker(){if(S.markerRaf)cancelAnimationFrame(S.markerRaf);S.markerRaf=null}
function clearFightMotion(){if(S.fightRaf)cancelAnimationFrame(S.fightRaf);S.fightRaf=null}
function clearTimers(){
 clearTimeout(S.t1);clearTimeout(S.t2);clearMarker();
 if(S.castRaf)cancelAnimationFrame(S.castRaf);S.castRaf=null
}

function castAnim(cb){
 if(S.castRaf)cancelAnimationFrame(S.castRaf);
 const a=tipPoint(),z=waterPoint(),st=performance.now(),dur=720;
 function frame(now){
   const p=Math.min(1,(now-st)/dur),q=1-Math.pow(1-p,3),arc=Math.sin(Math.PI*p)*132;
   S.castP=p;
   setBob(a.x+(z.x-a.x)*q,a.y+(z.y-a.y)*q-arc);
   if(p<1)S.castRaf=requestAnimationFrame(frame);
   else{S.castP=0;setBob(z.x,z.y);splash();S.castRaf=null;cb()}
 }
 S.castRaf=requestAnimationFrame(frame)
}
function cast(){
 if(S.phase!=="ready"||!S.bait)return;
 clearTimers();S.bait--;S.f=pick();S.weight=rand(S.f.lb[0],S.f.lb[1]);
 S.need=rint(S.f.hits[0],S.f.hits[1]);S.done=0;S.hearts=3;S.inputLocked=true;
 S.phase="casting";render();
 castAnim(()=>{
   S.phase="waiting";render();
   S.t1=setTimeout(()=>{
     S.phase="hook";S.inputLocked=false;$("bobber").classList.add("bite");
     S.biteKick=1;splash();screenShake();render();
     S.t2=setTimeout(()=>escape("The fish got away."),1500)
   },rand(1200,2900))
 })
}


function fishSizeFactor(){
 if(!S.f)return .2;
 return Math.max(0,Math.min(1,(S.weight-S.f.lb[0])/(S.f.lb[1]-S.f.lb[0]||1)))
}
function clearFightFx(){
 const fx=$("fightFx");if(fx)fx.innerHTML=""
}
function waterFx(intensity=1){
 const fx=$("fightFx");if(!fx)return;
 fx.style.left=S.bobX+"px";fx.style.top=S.bobY+"px";
 const size=fishSizeFactor();
 const n=Math.round(2+size*5+intensity*2);
 for(let i=0;i<n;i++){
   const b=document.createElement("span");b.className="fxBubble";
   const d=5+Math.random()*(5+size*5);
   b.style.width=d+"px";b.style.height=d+"px";
   b.style.left=(Math.random()*24-12)+"px";b.style.top=(Math.random()*12-2)+"px";
   b.style.setProperty("--dx",(Math.random()*46-23)+"px");
   b.style.setProperty("--dy",(-18-Math.random()*(24+size*28))+"px");
   fx.appendChild(b);setTimeout(()=>b.remove(),760)
 }
 const ring=document.createElement("span");ring.className="fxRing";
 const rd=22+size*28+intensity*10;ring.style.width=rd+"px";ring.style.height=(rd*.36)+"px";
 ring.style.left="0px";ring.style.top="8px";fx.appendChild(ring);setTimeout(()=>ring.remove(),650);
 const drops=Math.round(size*4+intensity);
 for(let i=0;i<drops;i++){
   const d=document.createElement("span");d.className="fxDrop";d.textContent="•";
   d.style.setProperty("--drop",(11+size*9)+"px");
   d.style.setProperty("--dx",(Math.random()*70-35)+"px");
   d.style.setProperty("--dy",(-20-Math.random()*(22+size*30))+"px");
   d.style.left="0px";d.style.top="0px";d.style.color="rgba(240,252,255,.9)";
   fx.appendChild(d);setTimeout(()=>d.remove(),600)
 }
 if(size>.55||intensity>1.25)splash();
}
function beginPull(){
 if(S.phase!=="fight")return;
 S.inputLocked=true;render();clearMarker();
 S.pullSide=Math.random()<.5?-1:1;
 const size=fishSizeFactor();
 S.pullStrength=.55+size*.45;
 S.pull=.12;
 const z=waterPoint(),start=performance.now(),dur=430+size*130;
 waterFx(.65+size*.8);
 function pullFrame(now){
   if(S.phase!=="fight")return;
   const p=Math.min(1,(now-start)/dur);
   const eased=Math.sin(Math.PI*Math.min(1,p));
   S.pull=.12+eased*S.pullStrength;
   const lateral=S.pullSide*(8+size*18)*eased;
   const down=(5+size*10)*eased;
   setBob(z.x+lateral,z.y+down);
   if(p<1)requestAnimationFrame(pullFrame);
   else{
     /* Reference rhythm: pull first, then a clear "NOW!" prompt, then timing. */
     showFightCue(startRound);
   }
 }
 requestAnimationFrame(pullFrame)
}


function showFightCue(next){
 const cue=$("fightCue");
 cue.classList.remove("show");void cue.offsetWidth;cue.classList.add("show");
 S.inputLocked=true;render();
 setTimeout(()=>{
   cue.classList.remove("show");
   if(S.phase==="fight"&&next)next();
 },420)
}

function initializeFight(){
 const size=fishSizeFactor();

 /* Match the reference: the first timing zone is intentionally generous.
    Big/heavy fish start a little smaller, but Pebblefin's beginning fish
    should feel easy enough to learn. */
 S.baseWidth=.68-size*.14;
 S.baseWidth=Math.max(.50,Math.min(.68,S.baseWidth));

 /* Beginner pond speed is readable. Stronger fish speed up naturally. */
 S.baseSpeed=.70+S.f.speed*.34+size*.10;

 const half=S.baseWidth/2;
 S.center=rand(half+.04,1-half-.04);
}
function hook(){
 if(S.phase!=="hook")return;
 clearTimeout(S.t2);$("bobber").classList.remove("bite");
 S.phase="fight";S.inputLocked=true;S.fightT=0;S.pull=0;initializeFight();splash();render();
 setTimeout(beginPull,220)
}

function startRound(){
 clearMarker();
 if(S.phase!=="fight")return;

 const size=fishSizeFactor();
 const progress=S.need<=1?0:S.done/(S.need-1);

 /* Small fish barely tighten. Large fish progressively squeeze the window. */
 const totalShrink=.10+size*.42;
 S.width=Math.max(.18,S.baseWidth*(1-totalShrink*progress));
 const half=S.width/2;

 /* Speed also rises, but gently in the starter pond. */
 const roundSpeed=S.baseSpeed*(1+(.08+size*.18)*progress);

 $("good").style.left=(S.center-half)*100+"%";
 $("good").style.width=S.width*100+"%";
 const pw=S.width*.24;
 $("perfect").style.left=(S.center-pw/2)*100+"%";
 $("perfect").style.width=pw*100+"%";

 S.pos=S.pullSide>0?.02:.98;
 S.dir=S.pos<.5?1:-1;
 S.last=performance.now();
 $("marker").style.left=S.pos*100+"%";
 $("fight").classList.add("show");

 /* No reel counter: the landing point stays a mystery like the reference. */
 $("callout").textContent="";
 S.inputLocked=false;render();

 function move(now){
   if(S.phase!=="fight"||S.inputLocked){S.markerRaf=null;return}
   const dt=Math.min(40,now-S.last);S.last=now;
   S.pos+=S.dir*(dt/1000)*roundSpeed;
   if(S.pos>=.99){S.pos=.99;S.dir=-1}
   else if(S.pos<=.01){S.pos=.01;S.dir=1}

   const edge=Math.abs(S.pos-.5)*2;
   S.pull=.34+(1-edge)*.45*S.pullStrength;
   const z=waterPoint();
   const sf=fishSizeFactor();
   setBob(z.x+S.pullSide*(5+sf*10)*S.pull,z.y+(4+sf*7)*S.pull);

   $("marker").style.left=S.pos*100+"%";
   S.markerRaf=requestAnimationFrame(move)
 }
 S.markerRaf=requestAnimationFrame(move)
}
function reel(){
 if(S.phase!=="fight"||S.inputLocked)return;
 S.inputLocked=true;clearMarker();render();
 const d=Math.abs(S.pos-S.center),half=S.width/2;
 if(d<=half){
   S.done++;
   const perfect=d<=S.width*.15;
   S.reelKick=1;S.pull=.08;
   $("fightCue").classList.remove("show");popCallout(perfect?"PERFECT!":"COOL!");pulseTrack("hit");waterFx(perfect?1.15:.8);
   if(S.done>=S.need){
     S.phase="landing";render();$("fight").classList.remove("show");
     setTimeout(caught,560)
   }else{
     setTimeout(()=>{
       if(S.phase==="fight"){
         $("fight").classList.remove("show");
         S.pull=.12;
         beginPull()
       }
     },500)
   }
 }else{
   S.hearts--;S.missKick=1;S.pull=1;
   $("fightCue").classList.remove("show");popCallout("MISS!");pulseTrack("miss");screenShake();waterFx(1.25);render();
   if(S.hearts<=0){
     S.phase="landing";render();$("fight").classList.remove("show");
     setTimeout(()=>escape("Line snapped!"),560)
   }else{
     setTimeout(()=>{
       if(S.phase==="fight"){
         $("fight").classList.remove("show");
         S.pull=.12;
         beginPull()
       }
     },560)
   }
 }
}

function escape(msg){
 clearTimers();clearFightFx();$("fightCue").classList.remove("show");$("fight").classList.remove("show");$("bobber").classList.remove("bite");
 S.phase="ready";S.inputLocked=false;S.f=null;S.pull=0;S.reelKick=0;S.missKick=0;S.biteKick=0;
 const z=waterPoint();setBob(z.x,z.y);render();status(msg,"Cast again when you're ready.")
}
function addXP(n){
 S.xp+=n;
 while(S.xp>=S.xpNeed){
   S.xp-=S.xpNeed;S.level++;
   S.xpNeed=xpNeeds[S.level]||Math.round(50+18*Math.pow(S.level+1,2));
   const reward=50+S.level*10;S.coins+=reward;S.levelQueue.push({level:S.level,coins:reward})
 }
}
function showNextLevelUp(){
 if(!S.levelQueue.length){
   $("levelOverlay").classList.remove("show");
   if(S.pendingCatchCard){S.pendingCatchCard=false;$("overlay").classList.add("show")}
   return
 }
 const item=S.levelQueue.shift();
 $("levelReached").textContent=item.level;$("levelCoins").textContent=item.coins;
 $("levelOverlay").classList.add("show")
}
function caught(){
 clearTimers();clearFightFx();$("fightCue").classList.remove("show");$("fight").classList.remove("show");
 const f=S.f,p=(S.weight-f.lb[0])/(f.lb[1]-f.lb[0]||1);
 const c=Math.round(f.coins[0]+p*(f.coins[1]-f.coins[0]));
 const fresh=!S.found.has(f.id),record=S.weight>(S.records[f.id]||0);
 S.first=false;S.found.add(f.id);if(record)S.records[f.id]=S.weight;S.coins+=c;addXP(f.xp);
 $("newtag").textContent=fresh?"NEW CATCH!":record?"NEW RECORD!":"";
 $("rarity").textContent=f.rarity;$("art").textContent=f.art;$("name").textContent=f.name;
 $("meta").textContent=`${S.weight.toFixed(2)} lb${record?" • New record":""}`;
 $("gaincoins").textContent=c;$("gainxp").textContent=f.xp;
 S.phase="caught";S.inputLocked=true;S.pull=0;render();status("Catch complete.","Rewards ready.");splash();
 const leap=$("catchFish");leap.textContent=f.art;leap.classList.remove("show");void leap.offsetWidth;leap.classList.add("show");
 setTimeout(()=>{
   leap.classList.remove("show");
   if(S.levelQueue.length){S.pendingCatchCard=true;showNextLevelUp()}
   else $("overlay").classList.add("show")
 },850)
}
function action(){
 if(S.phase==="ready")cast();
 else if(S.phase==="hook")hook();
 else if(S.phase==="fight")reel()
}

$("action").addEventListener("click",action);
$("levelContinue").addEventListener("click",showNextLevelUp);
$("again").addEventListener("click",()=>{
 $("overlay").classList.remove("show");
 S.phase="ready";S.inputLocked=false;S.f=null;S.pull=0;S.reelKick=0;S.missKick=0;S.biteKick=0;
 const z=waterPoint();setBob(z.x,z.y);render()
});
window.addEventListener("resize",()=>{if(S.phase==="ready"){const z=waterPoint();setBob(z.x,z.y)}});

requestAnimationFrame(()=>requestAnimationFrame(()=>{
 const z=waterPoint();setBob(z.x,z.y);updateRod();updateLine();render();rigLoop()
}));
})();

</script>
</body>
</html>
